name: Push Multi-Arch Latest Manifest

on:
  workflow_dispatch:
    inputs:
      commit_or_tag:
        description: 'Git commit SHA or tag to base :latest off'
        required: true


jobs:
  extractor:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      network: ${{ steps.release_info.outputs.network }}
    steps:
      - name: Clone and resolve tag/network
        id: release_info
        run: |
          set -euo pipefail
          git clone https://github.com/ProvableHQ/snarkOS.git snarkos
          cd snarkos
          git fetch --tags --quiet

          INPUT="${{ github.event.inputs.commit_or_tag }}"

          # If INPUT is a tag, use it; otherwise resolve the tag that contains the commit
          if git rev-parse -q --verify "refs/tags/$INPUT" > /dev/null; then
            TAG_NAME="$INPUT"
          else
            TAG_NAME="$(git describe --tags --exact-match "$INPUT" 2>/dev/null || git tag --contains "$INPUT" | head -n1 || true)"
          fi

          if [ -z "${TAG_NAME:-}" ]; then
            echo "No tag found for input: $INPUT"
            exit 1
          fi

          echo "Resolved tag: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "network=mainnet" >> "$GITHUB_OUTPUT"

  push-manifest:
    needs: extractor
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - name: Export Environment Variables
      run: |
        echo "GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}" >> $GITHUB_ENV
        echo "GCP_ARTIFACT_REGISTRY_REGION=${{ vars.GCP_ARTIFACT_REGISTRY_REGION }}" >> $GITHUB_ENV
        echo "GCP_ARTIFACT_REPO=${{ vars.GCP_ARTIFACT_REPO }}" >> $GITHUB_ENV
        echo "DOCKERHUB_REPO=${{ vars.DOCKERHUB_SNARKOS_REPO }}" >> $GITHUB_ENV
        echo "NETWORK_DIR=mainnet" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Authenticate with GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_IMG_BUILDER_KEY }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ vars.GCP_ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create and Push Multi-Arch Latest Manifest
      run: |
        # Inputs from extractor — telemetry is the default (unsuffixed) tag
        BASE_TAG="${{ needs.extractor.outputs.tag_name }}"  # e.g. v4.1.0

        # -------- GCP --------
        REG="${{ vars.GCP_ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPO}/${NETWORK_DIR}"

        # Tag/push :latest pointing at the version's amd64/arm64 images
        docker manifest create \
          ${REG}/snarkos:latest \
          --amend ${REG}/snarkos:${BASE_TAG}-amd64 \
          --amend ${REG}/snarkos:${BASE_TAG}-arm64
        docker manifest push ${REG}/snarkos:latest

        # -------- Docker Hub --------
        docker manifest create \
          ${DOCKERHUB_REPO}:latest \
          --amend ${DOCKERHUB_REPO}:${BASE_TAG}-amd64 \
          --amend ${DOCKERHUB_REPO}:${BASE_TAG}-arm64
        docker manifest push ${DOCKERHUB_REPO}:latest
